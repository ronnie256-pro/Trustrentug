{% extends "landlord/base_landlord.html" %}

{% block title %}Submit Property | TRUST{% endblock %}

{% block admin_content %}
<div class="container" style="padding: 4rem 1.5rem; text-align: center; max-width: 600px; margin: 0 auto;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; border: 1px solid var(--color-border); box-shadow: var(--shadow-sm);">
        <i class="fa-solid fa-house-medical" style="font-size: 3rem; color: var(--color-gold); margin-bottom: 1rem;"></i>
        <h2 style="font-family: var(--font-heading); color: var(--color-emerald-darkest); margin-bottom: 0.5rem;">Submit New Property</h2>
        <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">Fill out the pop-up modal form to submit property details for physical verification.</p>
        <button type="button" onclick="openAddPropertyModal()" class="btn btn-gold" style="padding: 0.75rem 1.5rem; font-weight: 700; border: none; cursor: pointer;">
            <i class="fa-solid fa-plus" style="margin-right: 0.4rem;"></i> Open Pop-Up Modal
        </button>
    </div>
</div>

{% include "landlord/modal_add_property.html" %}

<script>
    document.addEventListener('DOMContentLoaded', function() {
        openAddPropertyModal();
    });
</script>
{% endblock %}
